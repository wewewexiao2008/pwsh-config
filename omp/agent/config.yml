modelRoles:
  task: openai-codex/gpt-6.1-terra:max
  slow: openai-codex/gpt-6-astra:xhigh
  plan: openai-codex/gpt-6-astra:xhigh
  vision: cursor/gemini-4-argon:high
  smol: openai-codex/gpt-6.1-terra:max
  commit: zhipu-coding-plan/glm-5.3-flash:max
  advisor: cursor/gemini-4-carbon:high
  memory: cursor/gemini-4-carbon:high
  default: cursor/gemini-4-carbon:medium
  tiny: cursor/gemini-4-carbon:high
defaultThinkingLevel: auto
setupVersion: 3
theme:
  dark: dark-catppuccin
  light: light
composer:
  shape: claude
statusLine:
  separator: powerline-thin
  contextLine: embedded
  transparent: false
  compactThinkingLevel: false
tui:
  textSizing: false
  tight: false
display:
  shimmer: kitt
  showTokenUsage: true
  cacheMissMarker: true
  hideToolActivity: true
advisor:
  enabled: false
  syncBacklog: "1"
prewalk:
  enabled: false
startup:
  quiet: false
contextPromotion:
  enabled: false
extendedContext: false
branchSummary:
  enabled: true
edit:
  mode: hashline
readLineNumbers: true
vault:
  enabled: true
github:
  enabled: true
hideThinkingBlock: true
tier:
  openai: priority
  google: priority
  subagent: inherit
  advisor: inherit
providers:
  fireworksTier: priority
cycleOrder:
  - default
  - slow
  - smol
  - tiny
  - vision
retry:
  fallbackChains:
    task:
      - onliqiu/gpt-6-astra:xhigh
      - cursor/gemini-4-carbon:high
      - deepseek/deepseek-flash
    smol:
      - onliqiu/gpt-6-astra:xhigh
      - cursor/gemini-4-carbon:high
      - deepseek/deepseek-flash
    tiny:
      - deepseek/deepseek-flash:max
      - zhipu-coding-plan/glm-5.3-flash:max
    slow:
      - onliqiu/gpt-6-astra:xhigh
      - codez/gpt-6-astra
    plan:
      - onliqiu/gpt-6-astra:xhigh
      - codez/gpt-6-astra:xhigh
      - openai-codex/gpt-6.1-terra:high
      - deepseek/deepseek-flash
    default:
      - openai-codex/gpt-6-astra:xhigh
      - onliqiu/gpt-6-astra:xhigh
      - codez/gpt-6-astra:xhigh
      - openai-codex/gpt-6.1-terra:high
      - deepseek/deepseek-flash
    commit:
      - zai/glm-5.3-flash
browser:
  headless: true
dev:
  autoqaConsent: granted
update:
  auto: true
