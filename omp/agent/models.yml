# Custom Codex provider mirrored from CC Switch `codez`.
# Active base URL matches ~/.codex/config.toml.
# Alternatives: https://api-cfmax.codezsy.com/v1
#               https://api-sss.zwenooo.link/v1
# API key is read from CC Switch, not stored here.
# service_tier=flex is injected only for this provider by
# ~/.omp/agent/extensions/codez-flex-tier.ts. Do not set tier.openai=flex:
# that also hits official openai / openai-codex / OpenRouter OpenAI models.
providers:
  codez:
    baseUrl: https://api-vps.codezsy.com/v1
    api: openai-responses
    apiKey: "!python C:/Users/a2895/.omp/agent/read-cc-switch-codex-key.py"
    models:
      - id: gpt-6-astra
        name: GPT-6 Astra (Codez)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: medium
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        supportsTools: true
        cost:
          input: 10
          output: 50
          cacheRead: 1
          cacheWrite: 12.5

      - id: gpt-5.6-sol
